<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV - Mensaje</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&display=swap');

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  overflow-x:hidden;
  background:#24102d;
  font-family:'Cormorant Garamond',serif;
}

.mensaje{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:42px 22px;
  isolation:isolate;
}

/* Imagen real de Pexels como fondo */
.mensaje::before{
  content:"";
  position:absolute;
  inset:-2%;
  z-index:-4;
  background-image:url("https://images.pexels.com/photos/16935915/pexels-photo-16935915.jpeg?cs=srgb&dl=pexels-bertellifotografia-16935915.jpg&fm=jpg");
  background-size:cover;
  background-position:center;
  transform:scale(1.03);
  filter:saturate(.82) brightness(.72);
}

/* capa lavanda/morado para hacer match con el trono */
.mensaje::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(
      ellipse at center,
      rgba(193,159,205,.20) 0%,
      rgba(95,55,108,.34) 48%,
      rgba(36,16,45,.78) 100%
    ),
    linear-gradient(
      180deg,
      rgba(37,16,46,.58) 0%,
      rgba(89,53,101,.18) 36%,
      rgba(44,21,53,.60) 100%
    );
}

.marco{
  position:absolute;
  inset:5.5% 7%;
  z-index:-1;
  border:1px solid rgba(229,202,137,.42);
  border-radius:46% 46% 4% 4% / 18% 18% 4% 4%;
  box-shadow:
    inset 0 0 30px rgba(255,255,255,.025),
    0 0 28px rgba(16,5,21,.15);
}

.marco::before{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(220,190,124,.20);
  border-radius:46% 46% 4% 4% / 18% 18% 4% 4%;
}

.halo{
  position:absolute;
  left:50%;
  top:49%;
  transform:translate(-50%,-50%);
  width:min(78vw,620px);
  height:72svh;
  z-index:-2;
  border-radius:50%;
  background:radial-gradient(
    ellipse,
    rgba(244,232,247,.14),
    rgba(196,163,207,.07) 47%,
    transparent 72%
  );
  filter:blur(12px);
}

.contenido{
  width:min(82vw,640px);
  text-align:center;
  color:#f6edf7;
  padding:48px 28px;
  position:relative;
  z-index:3;
  text-shadow:0 2px 7px rgba(25,9,31,.54);
}

.apertura{
  font-family:'Allura',cursive;
  font-size:clamp(44px,9vw,72px);
  line-height:1;
  color:#ead8ee;
  margin-bottom:22px;
  opacity:0;
  transform:translateY(12px);
  animation:aparecer 1.8s ease forwards .25s;
}

.texto{
  margin:0;
  font-size:clamp(25px,5.2vw,40px);
  line-height:1.34;
  font-weight:500;
  letter-spacing:.01em;
  opacity:0;
  transform:translateY(18px);
  animation:aparecer 2.2s ease forwards .65s;
}

.destacar{
  color:#f5e1a5;
}

.ornamento{
  margin:30px auto 0;
  width:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:#dfc47d;
  opacity:0;
  animation:aparecerSimple 1.8s ease forwards 1.55s;
}

.ornamento::before,
.ornamento::after{
  content:"";
  width:63px;
  height:1px;
  background:linear-gradient(90deg,transparent,#dfc47d);
}

.ornamento::after{
  background:linear-gradient(90deg,#dfc47d,transparent);
}

.spark{
  position:absolute;
  z-index:2;
  color:#f0d992;
  opacity:0;
  text-shadow:0 0 10px rgba(241,217,146,.78);
  animation:twinkle 4.8s ease-in-out infinite;
}

.s1{left:15%;top:22%;font-size:15px}
.s2{right:14%;top:31%;font-size:18px;animation-delay:1.2s}
.s3{left:20%;bottom:23%;font-size:13px;animation-delay:2.1s}
.s4{right:21%;bottom:19%;font-size:16px;animation-delay:3s}

.scroll-cue{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  color:#f4e8f5;
  text-shadow:0 0 10px rgba(24,8,30,.65);
}

.arrow{
  display:block;
  font-size:34px;
  animation:bounce 1.8s ease-in-out infinite;
}

@keyframes aparecer{
  to{opacity:1;transform:translateY(0)}
}

@keyframes aparecerSimple{
  to{opacity:1}
}

@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.65)}
  50%{opacity:1;transform:scale(1.25)}
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(7px)}
}

@media(max-width:600px){
  .mensaje{
    padding:34px 16px;
  }

  .marco{
    inset:4.5% 5%;
  }

  .contenido{
    width:88vw;
    padding:34px 18px;
  }

  .texto{
    font-size:clamp(23px,6.2vw,31px);
    line-height:1.30;
  }

  .apertura{
    font-size:clamp(43px,11vw,60px);
  }
}
</style>
</head>

<body>

<section class="mensaje">

  <div class="halo"></div>
  <div class="marco"></div>

  <span class="spark s1">✦</span>
  <span class="spark s2">✧</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✧</span>

  <div class="contenido">
    <div class="apertura">He aprendido</div>

    <p class="texto">
      que la vida es un regalo,<br>
      que cada día es una<br>
      oportunidad para ser mejor,<br>
      que los sueños se alcanzan<br>
      con esfuerzo, y que lo más<br>
      importante es rodearse<br>
      de las personas que<br>
      hacen este camino<br>
      <span class="destacar">más especial.</span>
    </p>

    <div class="ornamento">✦</div>
  </div>

  <div class="scroll-cue">
    <span class="arrow">⌄</span>
  </div>

</section>

</body>
</html>
