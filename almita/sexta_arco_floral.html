<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV - Sexta Sección</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&display=swap');

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  overflow-x:hidden;
  background:#24102d;
  font-family:'Cormorant Garamond',serif;
}

.sexta{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:38px 20px;
  isolation:isolate;
}

/* fondo real de Pexels */
.fondo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:-5;
  transform:scale(1.02);
  filter:saturate(.88) brightness(.74);
}

/* capa para llevar la foto al mismo universo del trono */
.overlay{
  position:absolute;
  inset:0;
  z-index:-4;
  background:
    radial-gradient(
      ellipse at 50% 46%,
      rgba(222,196,228,.16) 0%,
      rgba(137,93,151,.22) 38%,
      rgba(49,24,59,.48) 70%,
      rgba(31,13,39,.72) 100%
    ),
    linear-gradient(
      180deg,
      rgba(35,15,44,.48) 0%,
      rgba(63,34,74,.22) 34%,
      rgba(36,16,44,.62) 100%
    );
}

/* viñeta lateral */
.overlay2{
  position:absolute;
  inset:0;
  z-index:-3;
  background:linear-gradient(
    90deg,
    rgba(21,8,27,.42),
    transparent 18%,
    transparent 82%,
    rgba(21,8,27,.42)
  );
}

/* zona suave detrás del texto */
.halo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(84vw,650px);
  height:76svh;
  z-index:-2;
  border-radius:48%;
  background:radial-gradient(
    ellipse,
    rgba(45,20,55,.50) 0%,
    rgba(56,28,66,.32) 45%,
    transparent 74%
  );
  filter:blur(9px);
}

.marco{
  position:absolute;
  inset:5% 6%;
  z-index:-1;
  border:1px solid rgba(226,199,127,.40);
  border-radius:48% 48% 5% 5% / 18% 18% 5% 5%;
}

.marco::before{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(226,199,127,.18);
  border-radius:48% 48% 5% 5% / 18% 18% 5% 5%;
}

.contenido{
  position:relative;
  z-index:5;
  width:min(84vw,610px);
  text-align:center;
  color:#fbf5fc;
  padding:44px 24px;
}

.titulo{
  margin:0 0 23px;
  font-family:'Allura',cursive;
  font-size:clamp(48px,10vw,78px);
  line-height:.92;
  font-weight:400;
  color:#f3dff6;
  text-shadow:
    0 2px 4px rgba(21,7,27,.62),
    0 0 18px rgba(220,181,232,.26);
  opacity:0;
  transform:translateY(14px);
  animation:entrada 1.8s ease forwards .25s;
}

.texto{
  margin:0;
  font-size:clamp(23px,5vw,39px);
  line-height:1.33;
  font-weight:500;
  letter-spacing:.01em;
  text-shadow:
    0 2px 4px rgba(18,6,23,.75),
    0 0 10px rgba(30,12,37,.42);
  opacity:0;
  transform:translateY(18px);
  animation:entrada 2.2s ease forwards .65s;
}

.final{
  color:#f2d692;
  font-weight:600;
}

.ornamento{
  margin:31px auto 0;
  width:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  color:#e2c77f;
  opacity:0;
  animation:aparecer 1.8s ease forwards 1.5s;
}

.ornamento::before,
.ornamento::after{
  content:"";
  width:62px;
  height:1px;
  background:linear-gradient(90deg,transparent,#e2c77f);
}

.ornamento::after{
  background:linear-gradient(90deg,#e2c77f,transparent);
}

.spark{
  position:absolute;
  z-index:3;
  color:#f1da98;
  opacity:0;
  text-shadow:0 0 11px rgba(240,214,145,.78);
  animation:twinkle 4.8s ease-in-out infinite;
}

.s1{left:16%;top:20%;font-size:14px}
.s2{right:15%;top:31%;font-size:18px;animation-delay:1.1s}
.s3{left:21%;bottom:22%;font-size:13px;animation-delay:2.2s}
.s4{right:20%;bottom:18%;font-size:16px;animation-delay:3.1s}

.scroll-cue{
  position:absolute;
  z-index:6;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  color:#f5eaf7;
  text-shadow:0 0 10px rgba(23,7,29,.68);
}

.arrow{
  display:block;
  font-size:34px;
  animation:bounce 1.8s ease-in-out infinite;
}

@keyframes entrada{
  to{opacity:1;transform:translateY(0)}
}

@keyframes aparecer{
  to{opacity:1}
}

@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.65)}
  50%{opacity:1;transform:scale(1.25)}
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(7px)}
}

@media(max-width:600px){
  .fondo{
    object-position:46% center;
  }

  .contenido{
    width:88vw;
    padding:36px 18px;
  }

  .texto{
    font-size:clamp(22px,6vw,30px);
    line-height:1.30;
  }

  .titulo{
    font-size:clamp(46px,12vw,61px);
  }

  .marco{
    inset:4.5% 5%;
  }
}
</style>
</head>

<body>

<section class="sexta">

  <img class="fondo"
       src="https://images.pexels.com/photos/26673706/pexels-photo-26673706.jpeg?cs=srgb&dl=pexels-mibernaa-26673706.jpg&fm=jpg"
       alt=""
       aria-hidden="true">

  <div class="overlay"></div>
  <div class="overlay2"></div>
  <div class="halo"></div>
  <div class="marco"></div>

  <span class="spark s1">✦</span>
  <span class="spark s2">✧</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✧</span>

  <div class="contenido">
    <h1 class="titulo">He aprendido</h1>

    <p class="texto">
      que la vida es un regalo,<br>
      que cada día es una<br>
      oportunidad para ser mejor,<br>
      que los sueños se alcanzan<br>
      con esfuerzo, y que lo más<br>
      importante es rodearse<br>
      de las personas que<br>
      hacen este camino<br>
      <span class="final">más especial.</span>
    </p>

    <div class="ornamento">✦</div>
  </div>

  <div class="scroll-cue">
    <span class="arrow">⌄</span>
  </div>

</section>

</body>
</html>
