<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV - Segunda Sección</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap');

:root{
  --bg-1:#130817;
  --bg-2:#2a1035;
  --bg-3:#4b2358;
  --lavender:#cfa8db;
  --gold:#e6c67a;
  --gold-soft:#f4e0a5;
  --white:#fff8ff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg-1);
  color:white;
}

body{
  font-family:'Cormorant Garamond',serif;
  overflow-x:hidden;
}

.hero-xv{
  min-height:100svh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  isolation:isolate;
  background:
    radial-gradient(circle at 50% 16%, rgba(255,226,157,.20), transparent 18%),
    radial-gradient(circle at 20% 58%, rgba(214,162,229,.22), transparent 26%),
    radial-gradient(circle at 80% 58%, rgba(214,162,229,.22), transparent 26%),
    linear-gradient(180deg,#16091b 0%,#281032 45%,#120716 100%);
}

/* Halo central */
.hero-xv::before{
  content:"";
  position:absolute;
  width:min(88vw,520px);
  aspect-ratio:1/1.25;
  border-radius:50% 50% 44% 44%;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  background:
    radial-gradient(circle at 50% 28%, rgba(255,239,192,.18), transparent 30%),
    radial-gradient(circle at 50% 60%, rgba(201,142,220,.15), transparent 62%);
  filter:blur(5px);
  z-index:-3;
}

/* Suelo brillante */
.hero-xv::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-6%;
  transform:translateX(-50%);
  width:min(110vw,900px);
  height:32%;
  border-radius:50%;
  background:
    radial-gradient(ellipse at center, rgba(229,198,122,.16), transparent 54%),
    linear-gradient(180deg,rgba(255,255,255,.05),transparent 70%);
  filter:blur(2px);
  z-index:-4;
}

/* Arcos florales abstractos */
.arch{
  position:absolute;
  top:5%;
  width:44%;
  height:88%;
  border:1px solid rgba(230,198,122,.36);
  border-radius:48% 48% 18% 18%;
  box-shadow:
    inset 0 0 28px rgba(230,198,122,.05),
    0 0 30px rgba(164,99,187,.10);
  z-index:-1;
}

.arch.left{
  left:-18%;
  transform:rotate(4deg);
}

.arch.right{
  right:-18%;
  transform:rotate(-4deg);
}

.arch::before,
.arch::after{
  content:"✦  ❀  ✧  ❀  ✦";
  position:absolute;
  color:rgba(229,199,238,.72);
  font-size:clamp(18px,3vw,34px);
  letter-spacing:.35em;
  text-shadow:0 0 14px rgba(225,178,242,.45);
}

.arch::before{
  top:10%;
  left:18%;
  transform:rotate(78deg);
}

.arch::after{
  bottom:10%;
  right:10%;
  transform:rotate(100deg);
}

/* Chandelier */
.chandelier{
  position:absolute;
  top:2%;
  left:50%;
  transform:translateX(-50%);
  width:170px;
  height:160px;
  z-index:2;
  filter:drop-shadow(0 0 13px rgba(255,220,140,.36));
}

.chain{
  width:1px;
  height:52px;
  margin:auto;
  background:linear-gradient(var(--gold-soft),transparent);
}

.chandelier-ring{
  width:110px;
  height:30px;
  margin:auto;
  border:2px solid rgba(230,198,122,.8);
  border-top:none;
  border-radius:0 0 50% 50%;
  position:relative;
}

.chandelier-ring::before,
.chandelier-ring::after{
  content:"";
  position:absolute;
  top:20px;
  width:44px;
  height:1px;
  background:rgba(230,198,122,.75);
}

.chandelier-ring::before{
  left:3px;
  transform:rotate(32deg);
}

.chandelier-ring::after{
  right:3px;
  transform:rotate(-32deg);
}

.crystals{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:9px;
}

.crystals span{
  width:7px;
  height:23px;
  border-radius:60%;
  background:linear-gradient(180deg,#fff3bf,#b98540);
  box-shadow:0 0 9px rgba(255,228,156,.75);
  transform-origin:top center;
  animation:sway 3.8s ease-in-out infinite alternate;
}

.crystals span:nth-child(2){animation-delay:.4s;height:31px}
.crystals span:nth-child(3){animation-delay:.8s}
.crystals span:nth-child(4){animation-delay:1.2s;height:31px}
.crystals span:nth-child(5){animation-delay:1.6s}

@keyframes sway{
  from{transform:rotate(-4deg)}
  to{transform:rotate(4deg)}
}

/* Contenido */
.content{
  position:relative;
  z-index:5;
  width:min(90vw,680px);
  text-align:center;
  padding:140px 24px 90px;
}

.ornament{
  font-size:clamp(18px,4vw,28px);
  color:var(--gold);
  letter-spacing:.42em;
  margin-bottom:18px;
  animation:softGlow 3s ease-in-out infinite alternate;
}

.kicker{
  margin:0 0 clamp(45px, 8vw, 85px);
  font-size:clamp(18px,4vw,27px);
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#dcc5e2;
  opacity:.92;
}

.title{
  margin:0;
  line-height:.87;
  font-family:'Great Vibes',cursive;
  font-size:clamp(74px,18vw,150px);
  font-weight:400;
  color:var(--white);
  text-shadow:
    0 0 6px rgba(255,255,255,.8),
    0 0 14px rgba(235,198,255,.7),
    0 0 28px rgba(207,168,219,.55),
    0 0 45px rgba(230,198,122,.25);
  animation:brilloConstante 8s ease-in-out infinite;
}

@keyframes brilloConstante{

  0%, 100%{
    text-shadow:
      0 0 4px rgba(255,255,255,.25),
      0 0 8px rgba(207,168,219,.20);
  }

  50%{
    text-shadow:
      0 0 12px rgba(255,255,255,1),
      0 0 26px rgba(235,198,255,.95),
      0 0 48px rgba(207,168,219,.85),
      0 0 75px rgba(230,198,122,.45);
  }
}

.subtitle{
  margin:22px auto 0;
  max-width:470px;
  font-size:clamp(20px,4.5vw,30px);
  font-style:italic;
  line-height:1.25;
  color:#eaddef;
}

.gold-line{
  width:120px;
  height:1px;
  margin:28px auto;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 8px rgba(230,198,122,.42);
}

/* Partículas */
.spark{
  position:absolute;
  z-index:1;
  color:#f3d993;
  text-shadow:0 0 12px rgba(255,220,145,.9);
  opacity:0;
  animation:twinkle 3.2s ease-in-out infinite;
}

.s1{top:22%;left:15%;font-size:20px}
.s2{top:31%;right:14%;font-size:26px;animation-delay:.7s}
.s3{bottom:28%;left:20%;font-size:18px;animation-delay:1.2s}
.s4{bottom:20%;right:21%;font-size:22px;animation-delay:1.8s}
.s5{top:48%;left:8%;font-size:15px;animation-delay:2.2s}
.s6{top:52%;right:8%;font-size:17px;animation-delay:2.6s}

@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.4)}
  50%{opacity:1;transform:scale(1.35)}
}

@keyframes softGlow{
  from{opacity:.55;text-shadow:0 0 4px rgba(230,198,122,.2)}
  to{opacity:1;text-shadow:0 0 14px rgba(230,198,122,.55)}
}

/* Pétalos flotantes */
.petal{
  position:absolute;
  color:#d3a2df;
  opacity:.45;
  font-size:20px;
  z-index:0;
  animation:fall linear infinite;
}

.p1{left:8%;top:-5%;animation-duration:8s}
.p2{left:26%;top:-8%;animation-duration:10s;animation-delay:-3s}
.p3{left:73%;top:-6%;animation-duration:9s;animation-delay:-5s}
.p4{left:90%;top:-10%;animation-duration:11s;animation-delay:-7s}

@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:0}
  15%{opacity:.5}
  100%{transform:translateY(115vh) rotate(220deg);opacity:0}
}

/* Indicador inferior */
.scroll-cue{
  position:absolute;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  color:#e4cfeb;
  font-size:13px;
  letter-spacing:.22em;
  text-transform:uppercase;
  opacity:.72;
}

.arrow{
  display:block;
  margin-top:8px;
  font-size:27px;
  color:var(--gold);
  animation:bounce 1.8s ease-in-out infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(8px)}
}

@media(max-width:600px){
  .content{padding-top:130px}
  .arch{width:64%}
  .arch.left{left:-38%}
  .arch.right{right:-38%}
  .chandelier{transform:translateX(-50%) scale(.86)}
}
</style>
</head>

<body>

<section class="hero-xv">

  <div class="arch left"></div>
  <div class="arch right"></div>

  <div class="chandelier" aria-hidden="true">
    <div class="chain"></div>
    <div class="chandelier-ring"></div>
    <div class="crystals">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <span class="spark s1">✦</span>
  <span class="spark s2">✧</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✧</span>
  <span class="spark s5">✦</span>
  <span class="spark s6">✧</span>

  <span class="petal p1">❀</span>
  <span class="petal p2">✦</span>
  <span class="petal p3">❀</span>
  <span class="petal p4">✦</span>

  <div class="content">
    <div class="ornament">✦ ✧ ✦</div>
    <p class="kicker">Una noche para recordar</p>
    <h1 class="title">Mis XV</h1>
    <div class="gold-line"></div>
    <p class="subtitle">Un sueño que comienza a escribirse entre luces, flores y momentos inolvidables.</p>
  </div>

  <div class="scroll-cue">
    Continúa
    <span class="arrow">⌄</span>
  </div>

</section>

</body>
</html>
