<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis XV Almita</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#160b1c;
  overscroll-behavior:none;
}
body{touch-action:none}

#deck{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#160b1c;
}

.slide{
  position:absolute;
  inset:0;
  width:100%;
  height:100svh;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  background:#160b1c;
}
.slide.active{
  opacity:1;
  visibility:visible;
}
.slide iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  pointer-events:none;
}
.slide.interactive.active iframe{pointer-events:auto}

.next{
  position:absolute;
  z-index:50;
  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(27,12,35,.40);
  color:#fff;
  font-size:31px;
  line-height:40px;
  cursor:pointer;
  backdrop-filter:blur(5px);
  box-shadow:0 5px 18px rgba(0,0,0,.16);
  animation:bounce 2.2s ease-in-out infinite;
}
#slide-1 .next{display:none}
@keyframes bounce{
  0%,100%{transform:translate(-50%,0);opacity:.72}
  50%{transform:translate(-50%,7px);opacity:1}
}


/* TRANSICIÓN SUAVE ENTRE ESCENAS */
.slide{
  transition:
    opacity 1.12s ease,
    transform 1.25s cubic-bezier(.22,.65,.25,1),
    filter 1.12s ease;
}
.slide.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
  filter:blur(0);
}
.slide.outgoing{
  opacity:0;
  visibility:visible;
  transform:scale(1.022);
  filter:blur(1.8px) brightness(.78);
}
.slide.incoming{
  opacity:0;
  visibility:visible;
  transform:scale(.992);
  filter:blur(5px) brightness(.88);
}

#soft-glow{
  position:fixed;
  inset:0;
  z-index:2147483646;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(ellipse at center,
      rgba(240,213,250,.26) 0%,
      rgba(174,115,203,.13) 36%,
      rgba(45,20,56,.08) 70%,
      transparent 100%);
}
#soft-glow.play{
  animation:softGlow 1.35s ease-in-out forwards;
}
@keyframes softGlow{
  0%,100%{opacity:0}
  48%{opacity:1}
}

@media (min-width:900px){
  .slide iframe{
    max-width:760px;
    margin:0 auto;
    box-shadow:0 0 70px rgba(0,0,0,.28);
  }
}
</style>
</head>
<body>

<div id="deck">

<section class="slide interactive" id="slide-1" aria-hidden="false">
  <iframe src="index_almita_limpio.html" title="Sección 1" loading="eager"></iframe>
  <button class="next" aria-label="Siguiente" data-next="1">⌄</button>
</section>
<section class="slide" id="slide-2" aria-hidden="true">

<section class="slide" id="slide-3" aria-hidden="true">

<section class="slide" id="slide-4" aria-hidden="true">

</section>
<section class="slide" id="slide-5" aria-hidden="true">

<section class="slide" id="slide-6" aria-hidden="true">
  <iframe src="sexta_final_almita_animada.html" title="Sección 6" loading="lazy"></iframe>

<section class="slide" id="slide-7" aria-hidden="true">

<section class="slide" id="slide-8" aria-hidden="true">
  <iframe src="pagina8_corregida_sin_texto_fondo.html" title="Sección 8" loading="lazy"></iframe>

<section class="slide interactive" id="slide-9" aria-hidden="true">
  <iframe src="pagina9_estilo_pagina4_zabdi.html" title="Sección 9" loading="lazy"></iframe>
  <button class="next" aria-label="Siguiente" data-next="9">⌄</button>
</section>
<section class="slide interactive" id="slide-10" aria-hidden="true">
  <iframe src="pagina10_lila_oscuro.html" title="Sección 10" loading="lazy"></iframe>
  <button class="next" aria-label="Siguiente" data-next="10">⌄</button>
</section>
<section class="slide" id="slide-11" aria-hidden="true">
  <iframe src="pagina11_te_esperamos_luna_respira.html" title="Sección 11" loading="lazy"></iframe>
  
</section>
</div>

<div id="soft-glow" aria-hidden="true"></div>

<script>
const slides = [...document.querySelectorAll('.slide')];
const glow = document.getElementById('soft-glow');
let current = 0;
let busy = false;
let touchStartY = null;
let lastWheel = 0;

slides.forEach((s,i)=>{
  s.classList.toggle('active', i === 0);
  s.setAttribute('aria-hidden', i === 0 ? 'false' : 'true');
});

function transitionTo(index){
  if(busy || index < 0 || index >= slides.length || index === current) return;
  busy = true;

  const oldSlide = slides[current];
  const newSlide = slides[index];

  newSlide.classList.remove('active','outgoing');
  newSlide.classList.add('incoming');
  newSlide.setAttribute('aria-hidden','false');

  glow.classList.remove('play');
  void glow.offsetWidth;
  glow.classList.add('play');

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      oldSlide.classList.add('outgoing');
      newSlide.classList.remove('incoming');
      newSlide.classList.add('active');
    });
  });

  setTimeout(()=>{
    oldSlide.classList.remove('active','outgoing');
    oldSlide.setAttribute('aria-hidden','true');
    current = index;
  }, 1180);

  setTimeout(()=>{
    glow.classList.remove('play');
    busy = false;
  }, 1320);
}

function nextSlide(){ transitionTo(current + 1); }
function prevSlide(){ transitionTo(current - 1); }

document.querySelectorAll('.next').forEach(btn=>{
  btn.addEventListener('click', e=>{
    e.preventDefault();
    e.stopPropagation();
    transitionTo(Number(btn.dataset.next));
  });
});

window.addEventListener('wheel', e=>{
  if(busy) return;
  const now = Date.now();
  if(now - lastWheel < 850 || Math.abs(e.deltaY) < 25) return;
  lastWheel = now;
  e.preventDefault();
  if(e.deltaY > 0) nextSlide();
  else prevSlide();
}, {passive:false});

window.addEventListener('touchstart', e=>{
  if(e.touches.length === 1) touchStartY = e.touches[0].clientY;
}, {passive:true});

window.addEventListener('touchend', e=>{
  if(touchStartY === null || busy) return;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartY = null;
  if(Math.abs(dy) < 55) return;
  if(dy < 0) nextSlide();
  else prevSlide();
}, {passive:true});

window.addEventListener('message', e=>{
  if(!e.data) return;
  if(e.data.type === 'almita-next-from-envelope') transitionTo(1);
  if(e.data.type === 'almita-slide-next') nextSlide();
  if(e.data.type === 'almita-slide-prev') prevSlide();
  if(e.data.type === 'almita-rsvp-confirmed') transitionTo(10);
});
</script>
</body>
</html>
