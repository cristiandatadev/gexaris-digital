<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis XV Almita</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#160b1c;
  overscroll-behavior:none;
}
body{touch-action:none}

#deck{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#160b1c;
}

.slide{
  position:absolute;
  inset:0;
  width:100%;
  height:100svh;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  background:#160b1c;
}
.slide.active{
  opacity:1;
  visibility:visible;
}
.slide iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  pointer-events:none;
}
.slide.interactive.active iframe{pointer-events:auto}

.next{
  position:absolute;
  z-index:50;
  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(27,12,35,.40);
  color:#fff;
  font-size:31px;
  line-height:40px;
  cursor:pointer;
  backdrop-filter:blur(5px);
  box-shadow:0 5px 18px rgba(0,0,0,.16);
  animation:bounce 2.2s ease-in-out infinite;
}
#slide-1 .next{display:none}
@keyframes bounce{
  0%,100%{transform:translate(-50%,0);opacity:.72}
  50%{transform:translate(-50%,7px);opacity:1}
}


/* TRANSICIÓN SUAVE ENTRE ESCENAS */
.slide{
  transition:
    opacity 1.12s ease,
    transform 1.25s cubic-bezier(.22,.65,.25,1),
    filter 1.12s ease;
}
.slide.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
  filter:blur(0);
}
.slide.outgoing{
  opacity:0;
  visibility:visible;
  transform:scale(1.022);
  filter:blur(1.8px) brightness(.78);
}
.slide.incoming{
  opacity:0;
  visibility:visible;
  transform:scale(.992);
  filter:blur(5px) brightness(.88);
}

#soft-glow{
  position:fixed;
  inset:0;
  z-index:2147483646;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(ellipse at center,
      rgba(240,213,250,.26) 0%,
      rgba(174,115,203,.13) 36%,
      rgba(45,20,56,.08) 70%,
      transparent 100%);
}
#soft-glow.play{
  animation:softGlow 1.35s ease-in-out forwards;
}
@keyframes softGlow{
  0%,100%{opacity:0}
  48%{opacity:1}
}

@media (min-width:900px){
  .slide iframe{
    max-width:760px;
    margin:0 auto;
    box-shadow:0 0 70px rgba(0,0,0,.28);
  }
}

.swipe-hint{
  position:fixed;z-index:2147483644;left:50%;
  bottom:max(68px,calc(env(safe-area-inset-bottom) + 68px));
  transform:translateX(-50%);color:#fff;
  font:600 14px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;
  letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.75);
  pointer-events:none;opacity:0;transition:opacity .35s ease;
  animation:hintMove 1.7s ease-in-out infinite;white-space:nowrap;
}
.swipe-hint.show{opacity:.92}
@keyframes hintMove{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
.progress{
  position:fixed;z-index:2147483644;top:max(12px,calc(env(safe-area-inset-top) + 8px));
  left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:none;
}
.progress i{display:block;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);
  box-shadow:0 1px 5px rgba(0,0,0,.35);transition:transform .3s ease,background .3s ease}
.progress i.on{background:rgba(255,255,255,.95);transform:scale(1.45)}
.maps-final{
  position:absolute;z-index:80;left:50%;
  bottom:max(42px,calc(env(safe-area-inset-bottom) + 42px));
  transform:translateX(-50%);display:inline-flex;align-items:center;justify-content:center;
  min-width:190px;padding:14px 22px;border-radius:999px;color:#fff;text-decoration:none;
  font:600 16px/1 system-ui,-apple-system,Segoe UI,sans-serif;background:rgba(54,25,68,.72);
  border:1px solid rgba(255,255,255,.34);box-shadow:0 8px 26px rgba(0,0,0,.24);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
}

.date-card{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:28px 20px;color:#fff;
  background:radial-gradient(circle at 50% 38%,rgba(181,126,207,.38),transparent 35%),linear-gradient(180deg,#2d1639 0%,#5a3268 48%,#24112e 100%);
  font-family:Georgia,"Times New Roman",serif;
}
.date-sparkle{font-size:30px;animation:dateTwinkle 2.4s ease-in-out infinite}
.date-kicker{margin:6px 0 16px;font-size:clamp(28px,8vw,48px);font-style:italic;text-shadow:0 3px 16px rgba(0,0,0,.35)}
.date-card h2{margin:0;font-size:clamp(18px,5vw,27px);letter-spacing:.28em}
.date-main{display:flex;align-items:center;gap:18px;margin:10px 0 2px}
.date-main span{font-size:clamp(76px,23vw,130px);line-height:.9}
.date-main strong{writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(17px,4.5vw,25px);letter-spacing:.18em}
.date-time{margin:15px 0 0;font-size:clamp(23px,6.5vw,36px);font-weight:600}
.date-heart{font-size:27px;margin:10px 0 9px;animation:heartBeat 2s ease-in-out infinite}
.date-countdown-label{margin:0 0 8px;font-size:clamp(15px,3.8vw,20px);letter-spacing:.04em}
.date-countdown{display:flex;justify-content:center;gap:7px}
.date-countdown-box{width:clamp(61px,17vw,82px);padding:8px 3px 7px;border:1px solid rgba(255,255,255,.55);border-radius:13px;background:rgba(38,16,48,.48);box-shadow:0 7px 20px rgba(0,0,0,.23),inset 0 1px rgba(255,255,255,.25);backdrop-filter:blur(5px)}
.date-countdown-box span{display:block;font-size:clamp(21px,5.5vw,30px);font-weight:700;line-height:1}
.date-countdown-box small{display:block;margin-top:4px;font:600 clamp(9px,2.2vw,11px)/1 system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.date-countdown-message{margin:8px 0 0;font-size:clamp(20px,5vw,28px);font-style:italic}
@keyframes dateTwinkle{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.18);filter:drop-shadow(0 0 9px #fff)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.16);filter:drop-shadow(0 0 9px #dca8f0)}}


.final-maps-parent{position:fixed;z-index:2147483647;left:50%;bottom:max(114px,calc(env(safe-area-inset-bottom) + 114px));transform:translateX(-50%);display:none;align-items:center;justify-content:center;min-width:190px;padding:14px 24px;border-radius:999px;color:#fff;text-decoration:none;font:600 16px/1 system-ui,-apple-system,"Segoe UI",sans-serif;background:rgba(55,25,70,.86);border:1px solid rgba(255,255,255,.45);box-shadow:0 8px 28px rgba(0,0,0,.30);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}.final-maps-parent.show{display:flex}

</style>

<script>
(function iniciarCuentaRegresivaFecha(){
  const fechaEvento=new Date('2026-10-03T17:00:00-06:00').getTime();
  const contador=document.getElementById('date-countdown');
  const mensaje=document.getElementById('date-countdown-message');
  function actualizar(){
    const restante=fechaEvento-Date.now();
    if(restante<=0){contador.style.display='none';mensaje.textContent='¡Hoy es el gran día! 👑✨';return}
    const dia=86400000,hora=3600000,minuto=60000;
    document.getElementById('date-days').textContent=String(Math.floor(restante/dia)).padStart(2,'0');
    document.getElementById('date-hours').textContent=String(Math.floor((restante%dia)/hora)).padStart(2,'0');
    document.getElementById('date-minutes').textContent=String(Math.floor((restante%hora)/minuto)).padStart(2,'0');
    document.getElementById('date-seconds').textContent=String(Math.floor((restante%minuto)/1000)).padStart(2,'0');
  }
  actualizar();setInterval(actualizar,1000);
})();

const slides = [...document.querySelectorAll('.slide')];
const glow = document.getElementById('soft-glow');
const finalMapsParent = document.getElementById('final-maps-parent');
finalMapsParent.addEventListener('click', () => {
  const firstFrame = slides[0]?.querySelector('iframe');
  if(firstFrame?.contentWindow){
    firstFrame.contentWindow.postMessage({type:'almita-pause-music'}, '*');
  }
});
const swipeHint = document.getElementById('swipe-hint');
const progress = document.getElementById('progress');
let hintTimer = null;
slides.forEach((_,i)=>{const dot=document.createElement('i');if(i===0)dot.classList.add('on');progress.appendChild(dot);});
function updateNavUI(index){
  [...progress.children].forEach((d,i)=>d.classList.toggle('on',i===index));
  finalMapsParent.classList.toggle('show', index === slides.length-1);
  clearTimeout(hintTimer); swipeHint.classList.remove('show');
  if(index>0 && index<slides.length-2) hintTimer=setTimeout(()=>swipeHint.classList.add('show'),1400);
}
function hideHint(){swipeHint.classList.remove('show');clearTimeout(hintTimer);}
let current = 0;
let busy = false;
let touchStartY = null;
let lastWheel = 0;

slides.forEach((s,i)=>{
  s.classList.toggle('active', i === 0);
  s.setAttribute('aria-hidden', i === 0 ? 'false' : 'true');
});

updateNavUI(0);

function transitionTo(index){
  if(busy || index < 0 || index >= slides.length || index === current) return;
  hideHint(); updateNavUI(index);
  busy = true;

  const oldSlide = slides[current];
  const newSlide = slides[index];

  newSlide.classList.remove('active','outgoing');
  newSlide.classList.add('incoming');
  newSlide.setAttribute('aria-hidden','false');

  glow.classList.remove('play');
  void glow.offsetWidth;
  glow.classList.add('play');

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      oldSlide.classList.add('outgoing');
      newSlide.classList.remove('incoming');
      newSlide.classList.add('active');
    });
  });

  setTimeout(()=>{
    oldSlide.classList.remove('active','outgoing');
    oldSlide.setAttribute('aria-hidden','true');
    current = index;
  }, 1180);

  setTimeout(()=>{
    glow.classList.remove('play');
    busy = false;
  }, 1320);
}

function nextSlide(){ transitionTo(current + 1); }
function prevSlide(){ transitionTo(current - 1); }

document.querySelectorAll('.next').forEach(btn=>{
  btn.addEventListener('click', e=>{
    e.preventDefault();
    e.stopPropagation();
    transitionTo(Number(btn.dataset.next));
  });
});

window.addEventListener('wheel', e=>{
  hideHint();
  if(busy) return;
  const now = Date.now();
  if(now - lastWheel < 850 || Math.abs(e.deltaY) < 25) return;
  lastWheel = now;
  e.preventDefault();
  if(e.deltaY > 0) nextSlide();
  else prevSlide();
}, {passive:false});

window.addEventListener('touchstart', e=>{
  hideHint();
  if(e.touches.length === 1) touchStartY = e.touches[0].clientY;
}, {passive:true});

window.addEventListener('touchend', e=>{
  if(touchStartY === null || busy) return;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartY = null;
  if(Math.abs(dy) < 55) return;
  if(dy < 0) nextSlide();
  else prevSlide();
}, {passive:true});

window.addEventListener('message', e=>{
  if(!e.data) return;
  if(e.data.type === 'almita-next-from-envelope') transitionTo(1);
  if(e.data.type === 'almita-slide-next') nextSlide();
  if(e.data.type === 'almita-slide-prev') prevSlide();
  if(e.data.type === 'almita-rsvp-confirmed') transitionTo(9);
});
</script>
