<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años | Almita</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                180deg,
                #f8efff 0%,
                #e9d4ff 45%,
                #cba7f5 100%
            );
            font-family: Georgia, serif;
            overflow: hidden;
        }

        .welcome {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .small-text {
            font-size: 18px;
            letter-spacing: 3px;
            color: #6d4c7d;
            margin-bottom: 25px;
        }

        .envelope {
            width: 290px;
            height: 190px;
            position: relative;
            background: #f6e7ff;
            border-radius: 8px;
            box-shadow: 0 18px 40px rgba(74, 42, 92, 0.25);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.03);
        }

        .envelope::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    135deg,
                    transparent 49%,
                    #dcc0ee 50%
                );
            border-radius: 8px;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(0 0, 100% 0, 50% 58%);
            background: #ead2f7;
            transform-origin: top;
            transition: transform 1s ease;
            z-index: 3;
        }

        .seal {
            position: absolute;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%);
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #8d5ca8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            z-index: 4;
            box-shadow: 0 6px 15px rgba(0,0,0,0.18);
        }

        .open-text {
            margin-top: 28px;
            font-size: 16px;
            color: #6d4c7d;
            letter-spacing: 1px;
        }

        .envelope.open .flap {
            transform: rotateX(180deg);
        }

        .envelope.open .seal {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
    </style>
</head>

<body>

    <main class="welcome">

        <p class="small-text">UNA INVITACIÓN ESPECIAL</p>

        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="seal">XV</div>
        </div>

        <p class="open-text">Toca el sobre para abrir</p>

    </main>

    <script>
        const envelope = document.getElementById("envelope");

        envelope.addEventListener("click", () => {
            envelope.classList.add("open");
        });
    </script>

</body>
</html>
