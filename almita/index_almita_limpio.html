<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV - Almita</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');
  :root{
    --violet-1:#2d1738;
    --violet-2:#583668;
    --violet-3:#8c5ca0;
    --lavender:#c9a3d6;
    --lavender-light:#ead8ef;
    --gold:#d8b56a;
    --gold-dark:#9e7337;
    --cream:#fff8f1;
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:#160b1b;color:white}
  body{overflow:hidden}

  .scene{
    min-height:100svh;
    display:grid;
    place-items:center;
    position:relative;
    overflow:hidden;
    padding:24px;
    background:
      radial-gradient(circle at 15% 82%, rgba(215,171,239,.22), transparent 14%),
      radial-gradient(circle at 80% 72%, rgba(255,209,128,.16), transparent 16%),
      radial-gradient(circle at 25% 20%, rgba(255,221,173,.12), transparent 16%),
      linear-gradient(180deg,#24122d 0%,#100713 100%);
  }

  .scene::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 18% 22%, rgba(255,221,144,.8) 0 2px, transparent 3px),
      radial-gradient(circle at 76% 16%, rgba(255,221,144,.8) 0 2px, transparent 3px),
      radial-gradient(circle at 84% 68%, rgba(255,221,144,.65) 0 2px, transparent 3px),
      radial-gradient(circle at 35% 74%, rgba(255,221,144,.55) 0 2px, transparent 3px);
    filter:blur(.2px);
    animation:twinkle 3s ease-in-out infinite alternate;
    pointer-events:none;
  }

  @keyframes twinkle{from{opacity:.35}to{opacity:1}}

  .stage{
    transform:scale(.88);
    transform-origin:center center;

    width:min(94vw,760px);
    min-height:680px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .flowers{
    position:absolute;
    inset:auto 0 7% 0;
    pointer-events:none;
    font-size:clamp(30px,5vw,56px);
    opacity:.9;
    display:flex;
    justify-content:space-between;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));
  }

  .flowers span:first-child{transform:rotate(-14deg)}
  .flowers span:last-child{transform:rotate(14deg)}

  .envelope-wrap{
    width:min(88vw,640px);
    aspect-ratio:1.55/1;
    position:relative;
    perspective:1200px;
    filter:drop-shadow(0 32px 40px rgba(0,0,0,.38));
    cursor:pointer;
    user-select:none;
    z-index:3;
  }

  .envelope{
    position:absolute; inset:0;
  }

  .back{
    position:absolute;
    inset:0;
    border-radius:18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.16), transparent 28%),
      linear-gradient(155deg,#9a68aa 0%,#6e437c 55%,#4f2d5d 100%);
    border:1px solid rgba(229,195,239,.35);
    overflow:hidden;
  }

  .back::before,.back::after{
    content:"";
    position:absolute;
    bottom:0;
    width:55%;
    height:78%;
    background:linear-gradient(160deg,#765087,#593567);
    z-index:6;
  }
  .back::before{
    left:0;
    clip-path:polygon(0 0,100% 54%,0 100%);
  }
  .back::after{
    right:0;
    clip-path:polygon(100% 0,0 54%,100% 100%);
  }

  .bottom-fold{
    position:absolute;
    left:0;right:0;bottom:0;
    height:64%;
    background:linear-gradient(180deg,#664073,#4d2a59);
    clip-path:polygon(0 100%,50% 20%,100% 100%);
    z-index:7;
  }

  .flap{
    position:absolute;
    left:0;right:0;top:0;
    height:65%;
    transform-origin:50% 0%;
    transform-style:preserve-3d;
    z-index:10;
    transition:transform 1.1s cubic-bezier(.2,.75,.2,1),z-index 0s linear .55s;
  }

  .flap-face{
    position:absolute; inset:0;
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-radius:18px 18px 0 0;
    backface-visibility:hidden;
    background:
      linear-gradient(135deg,rgba(255,255,255,.18),transparent 28%),
      linear-gradient(160deg,#b587c4,#7e4d8e 70%);
    border-top:1px solid rgba(255,255,255,.34);
  }

  .flap-face::after{
    content:"";
    position:absolute;inset:12px 18px 20px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-top:2px solid rgba(216,181,106,.8);
    opacity:.85;
  }

  .ornaments{
    position:absolute;
    top:32px;left:0;right:0;
    display:flex;
    justify-content:space-around;
    color:var(--gold);
    letter-spacing:4px;
    z-index:12;
    pointer-events:none;
    opacity:.9;
    font-size:22px;
  }

  .card{
    position:absolute;
    left:8%;
    width:84%;
    height:91%;
    bottom:4%;
    background:
      radial-gradient(circle at 82% 14%, rgba(162,107,188,.16) 0 10%, transparent 28%),
      radial-gradient(circle at 14% 84%, rgba(162,107,188,.13) 0 10%, transparent 30%),
      radial-gradient(circle at 48% 32%, rgba(255,255,255,.86) 0 18%, transparent 48%),
      linear-gradient(145deg,#f8e8ea 0%,#fff7f3 42%,#f3e4f5 100%);
    border:2px solid rgba(216,181,106,.72);
    border-radius:10px;
    box-shadow:0 18px 35px rgba(26,8,31,.34);
    z-index:3;
    transform:translateY(0);
    transition:
      transform 1.35s cubic-bezier(.18,.88,.18,1) .55s,
      width .8s ease 1.8s,
      height .8s ease 1.8s,
      left .8s ease 1.8s,
      bottom .8s ease 1.8s;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:18px 18px 28px;
    color:#54355f;
    overflow:hidden;
  }
  .card{
    box-shadow:
      0 18px 35px rgba(26,8,31,.28),
      inset 0 0 0 5px rgba(255,255,255,.44),
      inset 0 0 26px rgba(124,78,143,.08);
  }
  .card-inner::before{
    content:"";
    position:absolute;
    top:5px;
    right:7px;
    bottom:18px;
    left:7px;
    border:1px solid rgba(216,181,106,.35);
    border-radius:8px;
    pointer-events:none;
  }

  .card::before,.card::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    opacity:.72;
    pointer-events:none;
  }
  .card::before{
    top:12px;right:12px;
    border-top:2px solid rgba(123,74,144,.42);
    border-right:2px solid rgba(216,181,106,.55);
    border-radius:0 14px 0 0;
    box-shadow:24px -18px 38px rgba(142,86,163,.13);
  }
  .card::after{
    bottom:12px;left:12px;
    border-bottom:2px solid rgba(123,74,144,.42);
    border-left:2px solid rgba(216,181,106,.55);
    border-radius:0 0 0 14px;
    box-shadow:-24px 18px 38px rgba(142,86,163,.13);
  }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    opacity:0;
    transform:translateY(-78px);
    transition:opacity .65s ease 1.1s,transform .65s ease 1.1s;
  }

  .crown{height:88px;margin:0 auto 4px;display:flex;justify-content:center;align-items:center}
  .crown-photo{width:92px;max-width:26vw;height:auto;display:block;filter:drop-shadow(0 7px 7px rgba(54,28,62,.24));}
  .small{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:#9b7d9f}
  h1{font-weight:400;font-size:clamp(38px,7vw,64px);margin:.06em 0;color:#65406f}
  .name{font-size:clamp(46px,10vw,82px);line-height:.95;margin:.02em 0 .14em;color:#4e2f5a}
  .divider{color:var(--gold);letter-spacing:.35em;margin:.25em 0 .65em}
  .message{font-size:clamp(17px,3vw,24px);line-height:1.45;margin:0 auto;max-width:520px}
  .story-text{
    font-family:'Cormorant Garamond','Times New Roman',serif;
    font-style:italic;
    margin:6px auto 0;
    max-width:360px;
    font-size:clamp(22px,4vw,34px);
    line-height:1.02;
    font-weight:500;
    color:#4b3159;
    letter-spacing:.01em;
  }

  .seal{
    position:absolute;
    left:50%;top:54%;
    transform:translate(-50%,-50%);
    width:88px;height:88px;
    border-radius:50%;
    display:grid;
    place-items:center;
    z-index:14;
    color:#5f3b24;
    background:
      radial-gradient(circle at 32% 28%,#ffe4a2 0 12%,#d9aa56 36%,#ac7434 74%,#7d4f22 100%);
    border:4px solid rgba(255,224,155,.58);
    box-shadow:0 7px 17px rgba(0,0,0,.35), inset 0 0 0 3px rgba(96,55,23,.15);
    font-size:39px;
    transition:transform .45s ease,opacity .45s ease;
  }

  .instruction{
    margin-top:34px;
    text-align:center;
    z-index:20;
    position:relative;
  }
  .instruction strong{
    display:block;
    font-family:Arial,sans-serif;
    letter-spacing:.20em;
    text-transform:uppercase;
    color:#d6b974;
    font-size:clamp(12px,2.3vw,18px);
    font-weight:500;
  }
  .instruction button{
    margin-top:18px;
    border:0;
    background:none;
    color:#eee1f0;
    text-decoration:underline;
    font-size:17px;
    cursor:pointer;
  }

  .music-btn{
    position:fixed;
    top:18px;right:18px;
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(216,181,106,.7);
    background:rgba(38,17,45,.62);
    color:#f3d99a;
    z-index:99;
    display:none;
    cursor:pointer;
    backdrop-filter:blur(8px);
  }

  .opened .flap{
    transform:rotateX(178deg);
    z-index:1;
  }
  .opened .seal{
    opacity:0;
    transform:translate(-50%,-68%) scale(.72);
  }
  .opened .card{
    transform:translateY(-50%);
  }
  .opened .card-inner{
    opacity:1;
    transform:translateY(0);
  }
  .opened.finished .card{
    width:82%;
    left:9%;
    height:96%;
    bottom:1%;
    transform:translateY(-24%);
  }
  .opened .instruction{opacity:.18;transition:opacity .5s ease}

  .petal{
    position:absolute;
    z-index:2;
    color:#cf93df;
    animation:float 5s linear infinite;
    opacity:.7;
    font-size:40px;
  }
  .p1{left:8%;top:15%;animation-delay:-1s}
  .p2{right:9%;top:30%;animation-delay:-3s}
  .p3{left:72%;bottom:12%;animation-delay:-2s}
  @keyframes float{
    0%{transform:translateY(-20px) rotate(0);opacity:0}
    15%{opacity:.7}
    100%{transform:translateY(110px) rotate(140deg);opacity:0}
  }

  @media(max-width:600px){
    .stage{min-height:600px}
    .envelope-wrap{width:94vw}
    .seal{width:70px;height:70px;font-size:30px}
    .ornaments{top:20px;font-size:16px}
    .card{padding:28px 18px}
    .opened.finished .card{width:84%;left:8%;height:94%;bottom:2%;transform:translateY(-22%)}
  }
</style>
</head>

        </article>

        <div class="bottom-fold"></div>

        <div class="flap">
          <div class="flap-face"></div>
          <div class="ornaments">✧ ❀ ✧ &nbsp;&nbsp;&nbsp;&nbsp; ✧ ❀ ✧</div>
        </div>

        <div class="seal">🦋</div>
      </div>
    </div>

    <div class="instruction">
      <strong>Toca el sobre para abrir con música</strong>
      <button id="noMusic">Continuar sin música</button>
    </div>
  </div>
</main>

<script>
  const stage = document.getElementById('stage');
  const envelope = document.getElementById('envelope');
  const noMusic = document.getElementById('noMusic');
  const music = document.getElementById('music');
  const musicBtn = document.getElementById('musicBtn');

  window.addEventListener('message', (e) => {
    if(e.data && e.data.type === 'almita-pause-music'){
      music.pause();
      musicBtn.textContent = '♫';
      musicBtn.setAttribute('aria-label', 'Reproducir música');
    }
  });


  let opened = false;

  async function openInvitation(withMusic){
    if(opened) return;
    opened = true;

    if(withMusic){
      try{
        await music.play();
        musicBtn.style.display = 'block';
        musicBtn.textContent = '❚❚';
      }catch(e){}
    }

    stage.classList.add('opened');
    setTimeout(()=>stage.classList.add('finished'), 1750);

    // Después de mostrar la tarjeta, avisamos a la página principal
    // para pasar automáticamente a la siguiente sección.
    setTimeout(()=>{
      window.parent.postMessage({ type: 'almita-next-from-envelope' }, '*');
    }, 3200);
  }

  envelope.addEventListener('click', ()=>openInvitation(true));

  noMusic.addEventListener('click', (e)=>{
    e.stopPropagation();
    openInvitation(false);
  });

  musicBtn.addEventListener('click', async ()=>{
    if(music.paused){
      try{
        await music.play();
        musicBtn.textContent = '❚❚';
      }catch(e){}
    }else{
      music.pause();
      musicBtn.textContent = '♫';
    }
  });
</script>
