<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV - Confirmar asistencia</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&display=swap');

:root{
  --morado:#542b61;
  --morado2:#2a1232;
  --lila:#eadcf0;
  --lila2:#c9afd2;
  --oro:#d9b86c;
  --texto:#3e2148;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:'Cormorant Garamond',serif;
  background:#d7c0df;
}

body{overflow-x:hidden}

/* ========= PÁGINA VISIBLE ========= */

.pagina10{
  position:relative;
  min-height:100svh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6svh 20px;
  isolation:isolate;
  background:
    radial-gradient(circle at 50% 38%, rgba(220,193,228,.32), transparent 34%),
    radial-gradient(circle at 50% 76%, rgba(76,42,88,.24), transparent 42%),
    linear-gradient(180deg,#5b3868 0%,#765481 24%,#9a74a8 49%,#76517f 73%,#4b2b58 100%);
}

/* decoración floral parecida a 10/12 */
.flor{
  position:absolute;
  z-index:0;
  color:#e1c5e8;
  opacity:.74;
  text-shadow:0 0 10px rgba(255,255,255,.35);
  animation:flotar 5s ease-in-out infinite;
  user-select:none;
}
.f1{left:2%;top:2%;font-size:46px}
.f2{left:9%;top:7%;font-size:28px;animation-delay:.8s}
.f3{right:3%;top:4%;font-size:41px;animation-delay:1.3s}
.f4{right:10%;top:10%;font-size:25px;animation-delay:2s}
.f5{left:3%;bottom:4%;font-size:42px;animation-delay:1.1s}
.f6{left:12%;bottom:10%;font-size:25px;animation-delay:2.3s}
.f7{right:3%;bottom:3%;font-size:47px;animation-delay:.5s}
.f8{right:12%;bottom:9%;font-size:26px;animation-delay:1.8s}

.mariposa{
  position:absolute;
  color:#e0bfe7;
  opacity:.72;
  z-index:0;
  font-size:26px;
  animation:mariposa 7s ease-in-out infinite;
}
.m1{left:8%;top:30%}
.m2{right:8%;top:24%;animation-delay:2s}
.m3{right:14%;bottom:22%;animation-delay:4s}

.portada{
  position:relative;
  z-index:3;
  width:min(88vw,560px);
  text-align:center;
  color:#fff5ff;
}

.icono-sobre{
  width:76px;
  height:56px;
  margin:0 auto 22px;
  position:relative;
  border-radius:5px;
  background:linear-gradient(145deg,#6d3c79,#4c2857);
  box-shadow:0 9px 18px rgba(69,38,77,.20);
}

.icono-sobre::before{
  content:"";
  position:absolute;
  inset:0;
  clip-path:polygon(0 0,50% 58%,100% 0);
  background:#81508d;
}

.icono-sobre::after{
  content:"♥";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-42%);
  color:#edd9ee;
  font-size:18px;
}

.titulo{
  margin:0;
  font-size:clamp(48px,10vw,78px);
  line-height:.95;
  font-weight:500;
  color:#fff5ff;
}

.subtitulo{
  margin:9px 0 28px;
  font-family:'Allura',cursive;
  font-size:clamp(38px,8vw,58px);
  line-height:1;
  color:#ead3ef;
}

.divisor{
  width:180px;
  margin:0 auto 25px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#f0d8f4;
}
.divisor::before,.divisor::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,transparent,rgba(240,216,244,.80));
}
.divisor::after{
  background:linear-gradient(90deg,rgba(240,216,244,.80),transparent);
}

.abrir-form{
  border:0;
  border-radius:999px;
  padding:15px 28px;
  min-width:min(86vw,330px);
  background:linear-gradient(135deg,#4d285a,#2e1737);
  color:#fff8ff;
  font-family:'Cormorant Garamond',serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:.10em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:
    0 10px 25px rgba(31,14,38,.32),
    inset 0 1px 0 rgba(255,255,255,.20);
  transition:.25s ease;
}

.abrir-form:hover{transform:translateY(-2px)}

@keyframes flotar{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-6px) rotate(3deg)}
}
@keyframes mariposa{
  0%,100%{transform:translate(0,0) rotate(-5deg)}
  50%{transform:translate(7px,-12px) rotate(6deg)}
}

/* ========= FORMULARIO EN MODAL ========= */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:18px;
  background:rgba(18,8,23,.72);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  overflow-y:auto;
}

.modal.activo{display:flex}

.panel{
  width:min(94vw,620px);
  margin:auto;
  position:relative;
  padding:28px 22px 24px;
  border-radius:28px;
  color:#fff7ff;
  background:
    radial-gradient(circle at 50% 0%, rgba(142,77,154,.34), transparent 35%),
    linear-gradient(180deg,#35153e,#1f0e26 72%,#170a1c 100%);
  border:1px solid rgba(231,201,239,.22);
  box-shadow:0 30px 80px rgba(0,0,0,.48);
  animation:panelIn .28s ease-out;
}

.cerrar{
  position:absolute;
  right:14px;
  top:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);
  color:white;
  font-size:24px;
  cursor:pointer;
}

.panel h2{
  margin:6px 42px 4px;
  text-align:center;
  font-size:clamp(34px,7vw,48px);
  font-weight:500;
}

.panel .intro{
  margin:0 auto 20px;
  text-align:center;
  max-width:470px;
  color:#dac5df;
  font-size:17px;
}

.campo{margin-bottom:14px}

.titulo-campo{
  display:block;
  margin:0 0 6px 3px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#f2e5f5;
}

input,textarea{
  width:100%;
  border:1px solid rgba(235,198,243,.38);
  border-radius:12px;
  background:rgba(89,47,99,.34);
  color:white;
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  padding:12px 14px;
  outline:none;
}

input::placeholder,textarea::placeholder{color:#c9b2ce}
input:focus,textarea:focus{
  border-color:#e9c8ef;
  box-shadow:0 0 0 3px rgba(225,178,235,.07);
}

.telefono{
  display:grid;
  grid-template-columns:86px 1fr;
}

.codigo{
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(235,198,243,.38);
  border-right:0;
  border-radius:12px 0 0 12px;
  background:rgba(89,47,99,.48);
}

.telefono input{border-radius:0 12px 12px 0}

.opciones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.opcion{position:relative}
.opcion input{
  position:absolute;
  opacity:0;
}
.opcion label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:50px;
  border:1px solid rgba(235,198,243,.38);
  border-radius:12px;
  background:rgba(89,47,99,.32);
  cursor:pointer;
  font-size:19px;
}
.opcion input:checked + label{
  background:rgba(149,87,163,.42);
  border-color:#efcff5;
  box-shadow:0 0 18px rgba(226,178,237,.14);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.consentimiento{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin:12px 2px 17px;
  color:#dccce0;
  font-size:14.5px;
  line-height:1.3;
}
.consentimiento input{
  width:19px;
  height:19px;
  flex:0 0 auto;
  margin-top:2px;
  accent-color:#a96cbc;
}

.enviar{
  width:100%;
  border:1px solid rgba(217,184,108,.75);
  border-radius:999px;
  padding:14px 18px;
  background:linear-gradient(135deg,#774581,#4e2958);
  color:white;
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  cursor:pointer;
}

.estado{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border-radius:13px;
  text-align:center;
  color:#f8ebfb;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
}

/* modal interno para consentimiento */
.aviso{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(8,3,11,.72);
  backdrop-filter:blur(5px);
}

.aviso.activo{display:flex}

.aviso-caja{
  width:min(90vw,420px);
  padding:24px 20px 20px;
  border-radius:22px;
  text-align:center;
  background:linear-gradient(180deg,#2f1537,#1b0d20);
  color:white;
  border:1px solid rgba(236,202,244,.24);
  box-shadow:0 24px 65px rgba(0,0,0,.45);
}

.aviso-caja h3{
  margin:0 0 9px;
  font-size:27px;
}

.aviso-caja p{
  margin:0 0 17px;
  color:#dbc9df;
  font-size:17px;
  line-height:1.35;
}

.aviso-caja button{
  border:0;
  border-radius:999px;
  padding:11px 23px;
  background:#8b5698;
  color:white;
  font-family:'Cormorant Garamond',serif;
  font-size:17px;
  cursor:pointer;
}

@keyframes panelIn{
  from{opacity:0;transform:translateY(18px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:600px){
  .pagina10{padding:5svh 16px}
  .titulo{font-size:clamp(44px,12vw,60px)}
  .subtitulo{font-size:clamp(38px,10vw,52px)}
  .panel{
    width:94vw;
    padding:24px 16px 20px;
    border-radius:23px;
  }
}
</style>
</head>

<body>

<section class="pagina10">

  <span class="flor f1">❀</span>
  <span class="flor f2">✿</span>
  <span class="flor f3">❀</span>
  <span class="flor f4">✿</span>
  <span class="flor f5">❀</span>
  <span class="flor f6">✿</span>
  <span class="flor f7">❀</span>
  <span class="flor f8">✿</span>

  <span class="mariposa m1">🦋</span>
  <span class="mariposa m2">🦋</span>
  <span class="mariposa m3">🦋</span>

  <div class="portada">
    <div class="icono-sobre"></div>

    <h1 class="titulo">Confirma</h1>
    <div class="subtitulo">tu asistencia</div>

    <div class="divisor">✦</div>

    <button class="abrir-form" id="abrirForm">
      Ver aviso ❯
    </button>
  </div>

</section>

<div class="modal" id="modalForm" aria-hidden="true">
  <div class="panel" style="max-width:520px;text-align:center;">
    <button class="cerrar" id="cerrarForm" aria-label="Cerrar">×</button>
    <div style="font-size:34px;margin:8px 0 10px;">💜</div>
    <h2>Confirmación de asistencia finalizada</h2>
    <p class="intro" style="font-size:19px;line-height:1.5;margin-top:14px;">
      El período para confirmar asistencia a los XV años de Almita ha finalizado.
      <br><br>
      Agradecemos mucho tu comprensión y el cariño hacia Almita en este momento tan especial. ✨
    </p>
    <button class="enviar" type="button" id="cerrarAviso" style="max-width:220px;margin-top:6px;">
      Cerrar
    </button>
  </div>
</div>

<script>
const abrirForm = document.getElementById('abrirForm');
const modalForm = document.getElementById('modalForm');
const cerrarForm = document.getElementById('cerrarForm');
const cerrarAviso = document.getElementById('cerrarAviso');

function abrirAviso(){
  modalForm.classList.add('activo');
  modalForm.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}

function cerrarAvisoConfirmacion(){
  modalForm.classList.remove('activo');
  modalForm.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

abrirForm.addEventListener('click', abrirAviso);
cerrarForm.addEventListener('click', cerrarAvisoConfirmacion);
cerrarAviso.addEventListener('click', cerrarAvisoConfirmacion);
modalForm.addEventListener('click', e=>{
  if(e.target === modalForm) cerrarAvisoConfirmacion();
});
</script>

<script>
(function(){
  let sy = null;
  let lastWheel = 0;

  function isControl(target){
    return !!target.closest('a,button,input,select,textarea,label,form,[role="button"],.modal,.modal-panel');
  }

  window.addEventListener('wheel', function(e){
    if(isControl(e.target)) return;
    const now = Date.now();
    if(now - lastWheel < 900 || Math.abs(e.deltaY) < 25) return;
    lastWheel = now;
    window.parent.postMessage({
      type: e.deltaY > 0 ? 'almita-slide-next' : 'almita-slide-prev'
    }, '*');
  }, {passive:true});

  window.addEventListener('touchstart', function(e){
    if(e.touches.length === 1 && !isControl(e.target)) sy = e.touches[0].clientY;
    else sy = null;
  }, {passive:true});

  window.addEventListener('touchend', function(e){
    if(sy === null) return;
    const dy = e.changedTouches[0].clientY - sy;
    sy = null;
    if(Math.abs(dy) < 55) return;
    window.parent.postMessage({
      type: dy < 0 ? 'almita-slide-next' : 'almita-slide-prev'
    }, '*');
  }, {passive:true});
})();
</script>

</body>
</html>
